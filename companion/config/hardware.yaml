pi:
  power_source: dedicated_buck_5v_5a

mavlink:
  connection: /dev/serial0
  # 57600, not 921600 - confirmed against a real Cube Orange on TELEM1.
  # 57600 is ArduPilot's default TELEM baud; a Mission Planner SERIAL1_BAUD=921
  # change appeared to save but never actually took effect on the FC, so the
  # real fix was matching the Pi's baud to what the FC was actually using,
  # not what the GCS UI displayed (see docs/hardware-wiring.md).
  baud: 57600
  # For sim/dev mode, main.py overrides this to a UDP endpoint talking to sim/mock_fc.py.

camera:
  width: 1280
  height: 720
  target_fps: 30
  # SSD MobileNetV2 FPN-Lite, COCO-pretrained, on-sensor NMS - confirmed
  # working against real IMX500 hardware (docs plan M2). 90 labels, 0-indexed
  # directly (no background offset) - see IMX500Detector.
  imx500_model_path: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  # Minimum on-sensor detection confidence to accept a box at all
  # (IMX500Detector.parse() drops anything below this before it ever
  # reaches tracking/selection). Lowered from the original 0.5 default to
  # 0.35 based on real evidence, not just the theoretical concern this
  # comment used to describe: tools/detection_regression.py's first real
  # capture on the actual hardware (2026-09-21) showed only a 36%
  # detection rate with a 59-frame (~2.2s) total dropout, while the
  # console log repeatedly showed real candidates at 0.44 and 0.32 -
  # genuine detections of whatever was in frame, filtered out purely for
  # being just under the old 0.5 cutoff, not because the subsystem wasn't
  # seeing anything. When detection did cross the old threshold, confidence
  # was solid (0.76 mean, 0.06 stdev) - this isn't a noisy model, it's a
  # threshold that was cutting off real detections. Re-run
  # `tools/detection_regression.py capture` + `analyze` after this change
  # to confirm the detection rate and longest gap actually improve; raise
  # back toward 0.5 if 0.35 trades in too many false positives in practice.
  score_threshold: 0.35
