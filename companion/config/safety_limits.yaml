# Cross-mode safety limits (apply during Follow/Orbit/Approach alike),
# separate from each guidance controller's own tuning limits.
#
# min_obstacle_distance_m: if ANY currently detected object (not just the
# tracked target) is estimated closer than this, the Safety Supervisor
# forces SAFE and all guidance output stops - a fast-closing obstacle is
# just as dangerous as the followed subject getting too close. Uses the
# same vision/rangefinder DistanceEstimator as Follow/Orbit, so it inherits
# the same accuracy caveats (see docs plan M4) - deliberately conservative.
min_obstacle_distance_m: 2.0

# Battery: at or below this remaining percentage all guidance stops and, if the
# Pi is the one holding the aircraft in GUIDED, RTL is requested (once). The
# FC's own battery failsafe (BATT_LOW_ACT / BATT_CRT_ACT) is the primary
# protection and should ALSO be configured; this only guarantees the
# companion is never still chasing a target on a nearly-empty pack. Unknown
# battery (no BATTERY_STATUS) never trips this.
min_battery_pct: 20
# Arm & Follow refuses to take off at or below this.
min_takeoff_battery_pct: 30

# GPS quality required by the one mode that navigates purely by GPS
# coordinates (grid search), and checked before an auto-takeoff. fix_type 3 =
# 3D fix. HDOP above max_hdop (lower = better) is treated as degraded.
min_gps_fix_type: 3
max_hdop: 2.5

# A FORCED disarm cuts the motors regardless of the FC's own flying-detection. On
# the ground that is the documented bench workaround; in the air it drops the
# aircraft. Refused above this height (metres above home) when altitude is known.
max_force_disarm_altitude_m: 1.5

# The AI Camera does not attach an AI result to every video frame. A frame
# without one reuses the last real detections (boxes, tap-to-select, the
# obstacle check) for at most detection_carry_max_s; past that, the frame
# counts as the model seeing nothing, so a stopped AI degrades to "target lost".
detection_carry_max_s: 0.5
# Follow/Orbit keep steering on the last known box only while the target has
# been unseen for less than this, then command a hold (zero velocity) until it
# is seen again. Short enough that a stale box can never steer the aircraft
# far; long enough that a single missed detection does not make it stutter.
target_hold_after_unseen_s: 0.3

# Service watchdog (deploy/ai-vision-drone.service, WatchdogSec=10): the systemd
# watchdog is only pinged while a frame has made it all the way through the
# pipeline within this many seconds. Longer than hardware.yaml's
# camera.stall_timeout_s (the camera's own, cleaner exit comes first), shorter
# than WatchdogSec.
pipeline_max_frame_age_s: 5.0
