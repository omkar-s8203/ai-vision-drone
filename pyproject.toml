[project]
name = "companion"
version = "0.1.0"
description = "Raspberry Pi companion-computer vision/AI stack for the AI Vision Drone project"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pi-only, hardware-dependent packages — not installable on a non-Pi dev machine.
pi = [
    "picamera2",
]
video = [
    # Verified working end-to-end (real aiortc peer over loopback) via
    # companion/tests/test_video_pipeline.py and test_integration_video.py.
    "aiortc>=1.9",
    "av>=11.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["companion/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
