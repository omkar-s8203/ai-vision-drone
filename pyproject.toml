[project]
name = "companion"
version = "0.1.0"
description = "Raspberry Pi companion-computer vision/AI stack for the AI Vision Drone project"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4",
    "pyserial>=3.5",  # required by pymavlink for real serial (not UDP) connections
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pi-only, hardware-dependent packages — not installable on a non-Pi dev machine.
pi = [
    "picamera2",
]
video = [
    # Verified working end-to-end (real aiortc peer over loopback) via
    # companion/tests/test_video_pipeline.py and test_integration_video.py.
    "aiortc>=1.9",
    "av>=11.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
benchmark = [
    # tools/benchmark_detection.py's CPU-usage measurement - optional,
    # degrades gracefully (reports "unavailable" instead of failing) if
    # not installed, see that module's own ImportError handling.
    "psutil>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["companion/tests", "sim/tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
# Repo root also has sim/ (dev-only test harness) and android/ (a separate
# Kotlin/Gradle project, not Python at all) as top-level directories -
# setuptools' automatic discovery refuses to guess between them ("Multiple
# top-level packages discovered in a flat-layout") and fails the build
# entirely. Only companion/ is meant to be installed; sim/ is imported via
# the working directory being on sys.path when running `python -m
# companion.main` from the repo root in sim mode, not via this package.
include = ["companion*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
